<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>RunStore</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<header>
<h1>🏃 CorreCaminos🏃🏃</h1>
<nav>
<ul>
<li>
    <a href="#"><i class="fa-solid fa-house"></i> Inicio</a>
</li>
<li>
    <a href="#productos"><i class="fa-solid fa-shoe-prints"></i> Productos</a>
</li>
<li>
    <a href="#contacto"><i class="fa-solid fa-envelope"></i> Contacto</a>
</li>
</ul>
</nav>
</header>

<main>
<section class="hero"><h2>Todo para runners</h2></section>

<section id="productos">
<h2>Productos</h2>
<div class="contenedor-productos">
<div class="card">
    <img src="img/zapatilla_1.jpg" alt="Zapatillas">
    <h3>Zapatillas</h3>
    <h4>⭐⭐⭐⭐⭐ Excelente</h4>
</div>
<div class="card">
    <img src="img/reloj-1.jpg" alt="Reloj">
    <h3>Reloj</h3>
    <h4>⭐⭐⭐⭐ Bueno</h4>
</div>
<div class="card">
    <img src="img/remera_1.jpg" alt="Remera">
    <h3>Remera</h3>
    <h4>⭐⭐⭐⭐⭐ Excelente</h4>
</div>
<div class="card">
    <img src="img/gorra_1.jpg" alt="Gorra">
    <h3>Gorra</h3>
    <h4>⭐⭐⭐⭐⭐ Excelente</h4>
</div>
</div>
</section>

<section id="contacto" class="contacto">
<h2>Contacto</h2>
<form action="https://github.com/squall14" method="POST">
<input type="text" name="nombre" placeholder="Nombre" required>
<input type="email" name="email" placeholder="Email" required>
<textarea name="mensaje" placeholder="Mensaje" required></textarea>
<button type="submit">Enviar</button>
</form>
</section>
</main>
<footer>
    <p>© 2026 Miguel León</p>
</footer>
</body>
</html>
